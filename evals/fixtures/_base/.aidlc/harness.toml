[project]
name = "fixture"

[capabilities]
fmt       = "ruff format --check {files}"
lint      = "ruff check --output-format=json {files}"
test      = "python3 -m pytest -q"

[formats]
lint = "ruff"
test = "generic"

[stages]
fast   = ["fmt", "lint"]
stop   = ["fast", "test"]
commit = ["stop", "secrets", "scope-drift", "budget"]
