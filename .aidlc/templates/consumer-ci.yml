# Generated by `harness init --ci`. Edit it — it is yours from here; re-running init will not
# overwrite it.
#
# What this does, and what it deliberately does not:
#
#   * On every pull request it runs the deterministic checks over the candidate diff. That is the
#     gate: it fails the build, and branch protection can require it.
#   * It then asks a model for an independent review and posts one comment with the findings,
#     deduped against what it has already said on this pull request. That is advice. It posts a
#     comment and nothing else — no review, no approval, no status check — because a machine that
#     could satisfy a review requirement would not be a review requirement.
#   * The merge gate is branch protection with a code-owner review. Configure it in the repository
#     settings: require this workflow's check, require a review from CODEOWNERS, and do not grant
#     the workflow token permission to approve. The harness never approves.
#
# The review step needs CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) in repository secrets.
# Without it the review is skipped and the checks still run: a missing credential must not look
# like a clean review.
name: harness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # to post the review comment, and nothing more

concurrency:
  group: harness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Add your project's own toolchain setup here — the harness runs the commands in
      # .aidlc/harness.toml, and they need their tools installed first.

      - name: checks
        run: |
          .aidlc/bin/harness check --stage fast \
            --base '${{ github.event.pull_request.base.sha }}' \
            --candidate '${{ github.event.pull_request.head.sha }}'

      - name: independent review
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --global @anthropic-ai/claude-code
          .aidlc/bin/harness review --comment \
            --repo '${{ github.repository }}' \
            --pr '${{ github.event.pull_request.number }}' \
            --base '${{ github.event.pull_request.base.sha }}' \
            --candidate '${{ github.event.pull_request.head.sha }}' \
            --budget-usd 2

      - name: say when the review was skipped
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: echo "::notice::no CLAUDE_CODE_OAUTH_TOKEN, so no independent review ran. The checks above still gate this pull request."
