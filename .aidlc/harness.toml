[project]
name = "lean-harness"

# The harness governs its own development. Note what is NOT here: no self-exemption. v6's
# strongest control was bypassed in the only repo it ever ran in (`isHarnessRepo()`), which is
# how a gate becomes decoration. If a gate here is wrong for this repo, it is wrong.
[capabilities]
fmt       = ""
lint      = ""      # zero-dependency by constitution: no linter to install
typecheck = ""
test      = "node --test --test-reporter=tap test/*.test.mjs"
test_quality = "node .aidlc/sensors/test-quality.mjs"
coverage  = ""
arch      = "node .aidlc/sensors/architecture.mjs"
secrets   = ""      # built-in scanner
deps      = ""      # no dependencies to go stale

[formats]
test = "tap"

[check]
fail_fast = true

[stages]
fast   = ["secrets"]
stop   = ["fast", "test"]
commit = ["stop", "scope-drift", "budget", "arch", "test_quality"]
drift  = []

[sensors]
behaviour = ["test"]
architecture = ["arch"]
hardening = ["secrets"]
qa = ["test_quality"]
required_profiles = ["behaviour", "architecture", "hardening", "qa"]
latency_budget_ms = 120000

[graph]
include = [".", ".claude"]
exclude = ["node_modules", ".venv", "dist", ".git", "__pycache__", "fixtures"]

[budget]
max_findings = 20

# The generator/evaluator split, as two model ids rather than a routing subsystem.
#
# lean-v2 cut 5 deleted 330 lines of policy resolution, handoff receipts and a provider adapter
# that no contract's evidence had ever invoked. Claude Code frontmatter does the same job: the
# `implement` skill runs on the generator in a forked context, the `evaluator` agent runs on the
# evaluator in a worktree it did not write to. `harness init` renders both from here.
#
# Haiku generates on purpose. A harness that steers a cheap model to a passing eval is a stronger
# harness than one that needs a frontier model to look good, and it makes the 22-task suite cheap
# enough to run on every steering change. Judgment stays frontier: that is Fusion's own result,
# and its own failure case is delegating the judgment itself.
[models]
generator = "claude-haiku-4-5-20251001"
evaluator = "claude-opus-5"

[limits]
skills          = 7
agents          = 3
hooks           = 5
hook_loc        = 600
claude_md_lines = 120

[guard]
protected_paths = ["evals/fixtures"]
require_contract = true

["node", "examples/collect-ci-failure-rate.mjs"]
timeout_ms = 300000
