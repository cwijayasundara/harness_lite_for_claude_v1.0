# Accepted artifacts fire the next stage. The job writes a draft spec or plan on a
# branch and opens a PR; it never pushes to main and never sets Status to approved.
name: harness-handoff
on:
  push:
    branches: [main, master]
    paths:
      - '.claude/artifacts/intent/**'
      - '.claude/artifacts/spec/**'
  workflow_dispatch:

jobs:
  next-stage:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: handoff
        run: |
          node .claude/bin/harness handoff --write --json | tee "$RUNNER_TEMP/handoff.json"
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/handoff.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "created=" + (d.created || []).length + "\n");
          '
      - name: Open a PR for the next-stage drafts
        if: steps.handoff.outputs.created != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lean-harness[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="harness/handoff-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add .claude/artifacts
          git -c commit.gpgsign=false commit -m "handoff: next-stage drafts from committed approvals"
          git push origin "$branch"
          gh pr create --title "Handoff: next AIDLC stage" --body "Created by \`harness handoff\` after a committed approval. Fill and approve the draft; this PR does not skip Gate 1 or Gate 2."
