# GitHub requires workflows at this exact path, so this is the one file that cannot live
# under .aidlc/. It is infrastructure, not a generated artefact.
# Pushes validate branches before a PR exists (and direct, explicitly authorized merges).
# PRs also run the credentialed golden-suite job; duplicate deterministic checks on PR branches
# are deliberate so a push run cannot cancel or substitute for that PR-only evidence.
name: harness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      model_smoke:
        description: Run the bounded live Claude mechanism smoke (requires repository API key)
        type: boolean
        default: false

jobs:
  candidate-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check the actual PR candidate
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .aidlc/state
          printf 'target=%s\ncandidate=%s\n' "$TARGET_SHA" "$CANDIDATE_SHA" > .aidlc/state/pr-revisions.txt
          BASE_SHA=$(git merge-base "$TARGET_SHA" "$CANDIDATE_SHA")
          printf 'base=%s\n' "$BASE_SHA" >> .aidlc/state/pr-revisions.txt
          .aidlc/bin/harness check --stage fast --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --pr-event "$GITHUB_EVENT_PATH" --json 2>&1 | tee .aidlc/state/pr-scope.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-scope-evidence
          path: |
            .aidlc/state/pr-revisions.txt
            .aidlc/state/pr-scope.log
            .aidlc/state/last-check.json
            .aidlc/state/ledger.jsonl
          if-no-files-found: warn

  product-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker build -t lean-harness-product:2.1.263 - < evals/Dockerfile
      - run: node --test test/product-trials.test.mjs
        env: { HARNESS_PRODUCT_DOCKER: '1' }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # The harness has no package dependencies. Its CLI-presence test needs Claude installed;
      # no model requests or credentials are used by this job.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm install --global @anthropic-ai/claude-code@2.1.263
      # Includes lifecycle-cli.test.mjs, which creates a real git repository and proves
      # committed approvals, failure exit codes, install idempotency, and incident SLA closure.
      # Do not replace it with `harness status` on this root: no artifacts would pass vacuously.
      - run: node --test test/*.test.mjs
      # Phase 3's exit criterion, re-checked on every push. If the graph stops earning its
      # place, that is a finding, not a nuisance.
      - run: node evals/bench/pack-bench.mjs

  cost:
    # Law 4's sibling: a token regression fails the build exactly like a failing test.
    # This half needs no API key — it measures the token surface the harness itself controls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Dependencies belong to the Python example, not the zero-dependency harness.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pytest==8.4.2 pytest-json-report==1.5.0 ruff==0.12.12
      - run: .aidlc/bin/harness check --stage stop
        working-directory: examples/scratch-py
        env:
          HARNESS_HOME: ${{ github.workspace }}/.aidlc
      # The example is a real installed project: it declares the harness and does not contain
      # one, exactly like a pod member's repository. HARNESS_HOME is how CI points the generated
      # shim at a checkout — here the repository itself, in a downstream project a clone made
      # from the commit in its install record.
      # in a directory that had no bin/ at all and died on `Cannot find module`.
      - run: .aidlc/bin/harness baseline check
        working-directory: examples/scratch-py
        env:
          HARNESS_HOME: ${{ github.workspace }}/.aidlc

  # Law 9: the suite runs on any diff touching the steering surface — CLAUDE.md, a skill, a role,
  # a hook, the registry. That trigger IS the governance model; it replaces certification tiers.
  #
  # lean-v2 B12. Three repairs. The path filter named `.aidlc/agents.json`, deleted in cut 4, and
  # did not name `.aidlc/sensors/`, which is a steering surface now. The run had no model, so it
  # could not use the cheap one. And it had no aggregate cap: per-task ceilings bound each task
  # and nothing bounded the run.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.model_smoke)
    env:
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: touched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -E '^(\.aidlc/(bin/|instructions\.md|harness\.toml|skills/|roles/|policies/|adapters/|checks/|sensors/|lib/|hooks/|templates/)|\.claude/(CLAUDE\.md|settings\.json)|\.claude-plugin/|\.github/workflows/harness\.yml|evals/(tasks\.json|products\.json|Dockerfile|expected\.json|fixtures/|lib/|bench/|run\.mjs|agent-mechanisms\.mjs))' \
            && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

      # Without a key the job says so and stops. It does not pass quietly: a steering change that
      # merged with no eval evidence is exactly what this exists to prevent, and a green tick that
      # means "we did not look" is worse than a red one.
      - if: steps.touched.outputs.run == 'true' && env.HAS_ANTHROPIC_API_KEY != 'true'
        run: |
          echo "::error::a steering surface changed and ANTHROPIC_API_KEY is not set — the eval suite cannot run"
          exit 1

      - if: steps.touched.outputs.run == 'true' && env.HAS_ANTHROPIC_API_KEY == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.263

      - if: github.event_name == 'pull_request' && steps.touched.outputs.run == 'true' && env.HAS_ANTHROPIC_API_KEY == 'true'
        run: node evals/run.mjs --require-auth --max-suite-usd 5
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }

      - if: github.event_name == 'pull_request' && steps.touched.outputs.run == 'true' && env.HAS_ANTHROPIC_API_KEY == 'true'
        run: node .aidlc/bin/harness evals gate

      - if: github.event_name == 'workflow_dispatch' && env.HAS_ANTHROPIC_API_KEY == 'true'
        run: node evals/agent-mechanisms.mjs
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-evidence
          path: .aidlc/evals/
          if-no-files-found: ignore
