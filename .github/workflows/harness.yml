# GitHub requires workflows at this exact path, so this is the one file that cannot live
# under .aidlc/. It is infrastructure, not a generated artefact.
# Pushes validate branches before a PR exists (and direct, explicitly authorized merges).
# Live model trials are explicit manual subscription runs; PR checks require no model credentials.
name: harness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      model_smoke:
        description: Run live Claude smoke using subscription allocation (requires OAuth token)
        type: boolean
        default: false

jobs:
  candidate-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check the actual PR candidate
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .aidlc/state
          printf 'target=%s\ncandidate=%s\n' "$TARGET_SHA" "$CANDIDATE_SHA" > .aidlc/state/pr-revisions.txt
          BASE_SHA=$(git merge-base "$TARGET_SHA" "$CANDIDATE_SHA")
          printf 'base=%s\n' "$BASE_SHA" >> .aidlc/state/pr-revisions.txt
          .aidlc/bin/harness check --stage fast --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --pr-event "$GITHUB_EVENT_PATH" --json 2>&1 | tee .aidlc/state/pr-scope.log
      - name: Export attributable check evidence
        if: always()
        shell: bash
        run: |
          if [ -f .aidlc/state/last-check.json ]; then
            INVOCATION=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(".aidlc/state/last-check.json")).provenance.invocation)')
            .aidlc/bin/harness ledger export --invocation "$INVOCATION" > .aidlc/state/check-export.json
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-scope-evidence
          path: |
            .aidlc/state/check-export.json
            .aidlc/state/pr-revisions.txt
            .aidlc/state/pr-scope.log
            .aidlc/state/last-check.json
            .aidlc/state/ledger.jsonl
          if-no-files-found: warn

  # The container boundary a live coding agent runs inside. These three tests assert operating
  # system isolation — that a process cannot read the private grading files, the comparison
  # secret, or the Docker socket — and there is no honest native equivalent, so they live in
  # test/container/ which the ordinary `test/*.test.mjs` glob does not reach. This job is the one
  # environment where Docker is guaranteed. Its failure is a failure: a container job that did not
  # run is never evidence that the boundary holds.
  container-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker build -t lean-harness-product:2.1.263 - < evals/Dockerfile
      - run: node --test test/container/*.test.mjs
        env: { HARNESS_PRODUCT_DOCKER: '1' }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # The harness has no package dependencies. Its CLI-presence test needs Claude installed;
      # no model requests or credentials are used by this job.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm install --global @anthropic-ai/claude-code@2.1.263
      # Includes lifecycle-cli.test.mjs, which creates a real git repository and proves
      # committed approvals, failure exit codes, install idempotency, and incident SLA closure.
      # Do not replace it with `harness status` on this root: no artifacts would pass vacuously.
      - run: node --test test/*.test.mjs
      # Phase 3's exit criterion, re-checked on every push. If the graph stops earning its
      # place, that is a finding, not a nuisance.
      - run: node evals/bench/pack-bench.mjs

  cost:
    # Law 4's sibling: a token regression fails the build exactly like a failing test.
    # This half needs no API key — it measures the token surface the harness itself controls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Dependencies belong to the Python example, not the zero-dependency harness.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pytest==8.4.2 pytest-json-report==1.5.0 ruff==0.12.12
      # Deliberate migration of this disposable CI example to the candidate runtime.
      # The historical example record remains intact in source control.
      - run: node .aidlc/bin/harness init --into examples/scratch-py
      - run: .aidlc/bin/harness doctor --json
        working-directory: examples/scratch-py
        env:
          HARNESS_HOME: ${{ github.workspace }}
      - run: .aidlc/bin/harness check --stage stop
        working-directory: examples/scratch-py
        env:
          HARNESS_HOME: ${{ github.workspace }}/.aidlc
      # The example is a real installed project: it declares the harness and does not contain
      # one, exactly like a pod member's repository. HARNESS_HOME is how CI points the generated
      # shim at a checkout — here the repository itself, in a downstream project a clone made
      # from the commit in its install record.
      # in a directory that had no bin/ at all and died on `Cannot find module`.
      - run: .aidlc/bin/harness baseline check
        working-directory: examples/scratch-py
        env:
          HARNESS_HOME: ${{ github.workspace }}/.aidlc

  # Explicit subscription usage only. Ordinary PRs never invoke a model.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.model_smoke
    timeout-minutes: 20
    env:
      HAS_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - if: env.HAS_SUBSCRIPTION_TOKEN != 'true'
        run: |
          echo "::error::CLAUDE_CODE_OAUTH_TOKEN is required for this requested live run. API billing is disabled."
          exit 1

      - if: env.HAS_SUBSCRIPTION_TOKEN == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.263

      - if: env.HAS_SUBSCRIPTION_TOKEN == 'true'
        run: node evals/agent-mechanisms.mjs --live
        env: { CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}' }

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-evidence
          path: .aidlc/evals/
          if-no-files-found: ignore
