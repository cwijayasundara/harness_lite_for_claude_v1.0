# Non-engineer intake. Turns an "intent" issue into a draft intent.md PR.
# Never sets Status to approved. Never pushes to main.
name: harness-intent
on:
  issues:
    types: [opened, labeled]

jobs:
  draft:
    if: github.event.repository.fork == false && contains(github.event.issue.labels.*.name, 'intent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: slug
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          raw=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/^intent-//')
          echo "slug=${raw:0:63}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read .aidlc/skills/intent/SKILL.md and .aidlc/templates/intent.md.
            Create a draft intent at .aidlc/artifacts/intent/${{ steps.slug.outputs.slug }}.md
            from this GitHub issue. Do not set Status to approved. Do not solution.
            Author: ${{ github.event.issue.user.login }}
            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Write(.aidlc/artifacts/intent/**),Edit(.aidlc/artifacts/intent/**)"
            --disallowedTools "Bash,NotebookEditCell"
            --max-turns 8
      - name: Fallback skeleton when no model key
        if: ${{ secrets.ANTHROPIC_API_KEY == '' }}
        run: node .aidlc/bin/harness new intent "${{ steps.slug.outputs.slug }}"
      - name: Open a PR for the draft intent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lean-harness[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="harness/intent-${{ steps.slug.outputs.slug }}"
          git checkout -b "$branch"
          git add .aidlc/artifacts/intent
          git -c commit.gpgsign=false commit -m "intent: draft from issue #${{ github.event.issue.number }}" || exit 0
          git push origin "$branch"
          gh pr create --title "Intent: ${{ steps.slug.outputs.slug }}" --body "Draft from issue #${{ github.event.issue.number }}. Product owner reviews and commits Status: approved. This PR does not skip Gate 1."
