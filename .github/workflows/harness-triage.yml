# Read-only judgment when the harness workflow fails. Posts a comment. No writes.
name: harness-triage
on:
  workflow_run:
    workflows: [harness]
    types: [completed]

jobs:
  triage:
    if: vars.HARNESS_MODEL_JOBS == 'enabled'
      && github.event.workflow_run.conclusion == 'failure' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The harness CI workflow failed. Read the logs available to you and write a
            three-line summary: likely cause, flaky vs real, what to check first.
            Do not edit files.
          claude_args: >-
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Write,Edit,MultiEdit,Bash,NotebookEditCell"
            --max-turns 6
      - if: github.event.workflow_run.pull_requests[0].number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triage ran for failed harness workflow ${{ github.event.workflow_run.id }}." > "$RUNNER_TEMP/triage.md"
          gh pr comment "${{ github.event.workflow_run.pull_requests[0].number }}" --body-file "$RUNNER_TEMP/triage.md" || true
