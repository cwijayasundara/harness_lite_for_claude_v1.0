# Fills a skeleton spec or plan on the handoff PR. Never sets Status to approved.
name: harness-design
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.claude/artifacts/spec/**'
      - '.claude/artifacts/plan/**'

jobs:
  fill:
    if: github.event.repository.fork == false && github.event.pull_request.head.ref != '' && startsWith(github.event.pull_request.head.ref, 'harness/handoff-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Fill the draft spec.md and/or plan.md on this branch from the approved
            predecessor artifact of the same slug. Apply org-policy skills if loaded.
            Do not set Status to approved. Do not edit product source.
            Flag policy concerns instead of resolving them.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit(.claude/artifacts/spec/**),Edit(.claude/artifacts/plan/**),Write(.claude/artifacts/spec/**),Write(.claude/artifacts/plan/**)"
            --disallowedTools "Bash,NotebookEditCell"
            --max-turns 12
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lean-harness[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/artifacts
          git -c commit.gpgsign=false diff --cached --quiet && exit 0
          git -c commit.gpgsign=false commit -m "handoff: fill next-stage draft (still unapproved)"
          git push
