# Deterministic control-band detection. No model is invoked. A breach writes
# incident.md + draft intent.md and opens a PR for triage. A first 3σ detect
# also runs staging rollback when [deployment].rollback is configured.
name: harness-monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  detect:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: detect
        run: |
          node .claude/bin/harness monitor detect --json | tee "$RUNNER_TEMP/detect.json"
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/detect.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "created=" + (d.files || []).length + "\n");
          '
      - name: Open a PR for the new incident and intent
        if: steps.detect.outputs.created != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lean-harness[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="harness/monitor-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add .claude/artifacts
          git -c commit.gpgsign=false commit -m "monitor: control-band breach → incident and intent"
          git push origin "$branch"
          gh pr create --title "Maintain: control-band breach" --body "Opened by \`harness monitor detect\`. Detection is deterministic. A first 3σ may include a staging rollback receipt. Triage the intent; do not treat this PR as production approval."
