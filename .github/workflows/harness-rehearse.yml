# Weekly staging rollback rehearsal. Skips when [deployment].rollback is empty.
name: harness-rehearse
on:
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch:

jobs:
  docker-compose-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rehearse immutable deploy, verification, denial, and rollback
        run: bash examples/docker-staging/rehearse.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-staging-receipts
          path: examples/docker-staging/.aidlc/artifacts/deployment/

  rollback-staging:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: configured
        run: |
          if grep -q '^rollback = \[' .aidlc/harness.toml && ! grep -q '^rollback = \[\]' .aidlc/harness.toml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.run == 'true'
        run: node .aidlc/bin/harness deploy rollback staging
      - if: steps.configured.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rollback-receipt
          path: .aidlc/artifacts/deployment/
          if-no-files-found: warn
