[project]
name = "lean-harness"

# The harness governs its own development. Note what is NOT here: no self-exemption. v6's
# strongest control was bypassed in the only repo it ever ran in (`isHarnessRepo()`), which is
# how a gate becomes decoration. If a gate here is wrong for this repo, it is wrong.
[capabilities]
fmt       = ""
lint      = ""      # zero-dependency by constitution: no linter to install
typecheck = ""
test      = "node --test --test-reporter=tap .claude/test/*.test.mjs"
coverage  = ""
arch      = ""      # candidate: import cycles from the graph — deliberately NOT added during Phase 5
secrets   = ""      # built-in scanner
deps      = ""      # no dependencies to go stale

[formats]
test = "tap"

[check]
fail_fast = true

[stages]
fast   = ["secrets"]
stop   = ["fast", "test"]
commit = ["stop", "plan-drift", "budget"]
drift  = []

[graph]
include = [".", ".claude"]
exclude = ["node_modules", ".venv", "dist", ".git", "__pycache__", "fixtures"]

[budget]
max_findings = 20

[limits]
skills          = 12
agents          = 3
hooks           = 5
hook_loc        = 600
claude_md_lines = 120

[guard]
protected_paths = [".claude/evals/fixtures"]
require_plan    = false

[monitoring]
collect = ["node", ".claude/examples/collect-ci-failure-rate.mjs"]
timeout_ms = 300000
